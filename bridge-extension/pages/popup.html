<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridge</title>
    <link rel="stylesheet" href="../css/popup.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M8 16.6Q16 8.2 24 16.6Z" fill="#6E1F33"/><path d="M6.5 16.8C6.5 16.8 11.2 7.6 16 7.6S25.5 16.8 25.5 16.8" stroke="#F6F0E4" stroke-width="2.6" stroke-linecap="round"/><rect x="6" y="15.7" width="20" height="2.7" rx="0.6" fill="#B08D57"/><rect x="8.3" y="18" width="3.3" height="8.2" rx="0.5" fill="#F6F0E4"/><rect x="20.4" y="18" width="3.3" height="8.2" rx="0.5" fill="#F6F0E4"/></svg></span>
      <div>
        <h1>Bridge</h1>
        <p>Pay foreign checkouts in Naira</p>
      </div>
    </header>

    <label class="toggle">
      <input id="enabled" type="checkbox" />
      <span>Offer Pay in Naira on checkout pages</span>
    </label>

    <section>
      <h2>How to use</h2>
      <ol>
        <li>Open a dollar checkout (or the demo).</li>
        <li>Click <strong>Pay in Naira</strong> on the overlay.</li>
        <li>Pay ₦. Wema settles the merchant in FX.</li>
      </ol>
    </section>

    <button id="demo" type="button">Open demo checkout</button>
    <p class="hint">No Grey. No virtual dollar card. You pay from a bank account you already have.</p>
    <script src="../js/popup.js"></script>
  </body>
</html>
